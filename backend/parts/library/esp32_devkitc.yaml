# Espressif ESP32-DevKitC V4 with ESP32-WROOM-32E (the WROVER variant uses GPIO16/17 for PSRAM: not this file).
# Pins and flash/input-only notes: Espressif user guide (source). Strapping and ADC pins: ESP32 datasheet,
# https://www.espressif.com/sites/default/files/documentation/esp32_datasheet_en.pdf
# Dimensions: https://dl.espressif.com/dl/schematics/esp32_devkitc_v4_dimensions.pdf
#   PCB 48.26 x 27.94; the module's antenna overhangs one short edge by 6.04, so l = 54.30.
#   h is an estimate: ~8.5 male headers below + 1.6 PCB + 3.1 module. Measure at H1.
# Regulator: AMS1117-3.3 (1 A) per https://dl.espressif.com/dl/schematics/esp32_devkitc_v4_sch.pdf;
#   power_budget_ma leaves headroom for the ESP32's own ~500 mA Wi-Fi peaks.
# Wokwi pin names: https://github.com/wokwi/wokwi-boards/blob/main/boards/esp32-devkit-c-v4/board.json
id: esp32_devkitc
name: ESP32-DevKitC V4 (ESP32-WROOM-32E)
category: mcu
logic_voltage: 3.3
supply_voltage: [5.0]  # micro-USB or the 5V pin
max_current_ma: 500
pio_board: esp32dev
wokwi_board: board-esp32-devkit-c-v4
