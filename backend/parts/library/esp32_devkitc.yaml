input_only_pins: [GPIO34, GPIO35, GPIO36, GPIO39]
strapping_pins: [GPIO0, GPIO2, GPIO5, GPIO12, GPIO15]
adc1_pins: [GPIO32, GPIO33, GPIO34, GPIO35, GPIO36, GPIO39]
