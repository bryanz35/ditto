# TowerPro SG90 9 g micro servo, 3-wire JR plug: brown GND, red VCC, orange PWM (50 Hz, 1-2 ms pulses).
# Wire colours and PWM timing: components101, https://components101.com/motors/servo-motor-basics-pinout-datasheet
# 4.8-6 V, "operation current ... about 0.5A - 2A", 23 x 12.2 x 29 mm, 0-150 degrees: source (TowerPro page,
# spec list and the vendor's answers under Reviews).
# max_current_ma uses the low end of that range as the peak (estimate): power it from 5V, not 3V3.
# 3.3 V on the signal wire usually works (not stated in the datasheet). The horn moves, so it sits outside
# the case and the enclosure gets a cable hole; l excludes the mounting tabs (~32 mm across).
id: servo_sg90
name: Micro servo (TowerPro SG90)
category: output
logic_voltage: 3.3
supply_voltage: [5.0]
max_current_ma: 500
pins:
  - {name: GND, type: gnd}  # brown
  - {name: VCC, type: power, voltage: 5.0}  # red
  - {name: PWM, type: gpio_out}  # orange
board_mm: {l: 23.0, w: 12.2, h: 29.0}
mounting: external
provisional: true
dims_source: datasheet
mount_holes: []
features: []
pio_lib_deps: ["madhephaestus/ESP32Servo"]
snippet: snippets/servo_sg90.cpp
mpn: SG90
vendor_url: https://www.towerpro.com.tw/product/sg90-7/
manual_price_usd: null  # no price on the TowerPro page
owned_alternatives: []
wokwi_type: wokwi-servo
wokwi_pins: {VCC: V+}  # Wokwi: PWM, V+, GND
wokwi_attrs: {}
source: https://www.towerpro.com.tw/product/sg90-7/
