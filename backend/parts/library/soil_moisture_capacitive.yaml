# Capacitive soil moisture sensor v1.2 (98 x 23 mm probe), 3-pin GND VCC AOUT, 3.3-5.5 V, ~5 mA.
# Output: higher voltage when dry (~2.5 V), lower when wet (~1.0 V); calibrate per soil. Source: vendor manual.
# Some clones carry an NE555 that misbehaves at 3.3 V (the intended part is a TLC555): check on the bench.
# The probe goes into the soil, so the part sits outside the case and the enclosure gets a cable hole.
# h is an estimate (PCB + 3-pin connector). Measure at H1.
