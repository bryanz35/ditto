# TowerPro MG996R metal-gear standard servo, 3-wire plug: brown GND, red VCC, orange PWM (50 Hz, 1-2 ms pulses).
# Wire colours and PWM timing: components101, https://components101.com/motors/mg996r-servo-motor-datasheet
# 4.8-6.6 V, 40.7 x 19.7 x 42.9 mm, 9.4 kg-cm at 4.8 V, 11 kg-cm at 6 V, 170 mA running, 1400 mA stall:
# source (TowerPro page). components101 gives 2.5 A at 6 V: run it from 5 V, never from a board's 3V3.
# 3.3 V on the signal wire usually works (not stated in the datasheet). l excludes the mounting tabs.
