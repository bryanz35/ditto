# Arduino Uno Rev3 (ATmega328P). Pins, 5 V logic, D0/D1 on the USB serial, I2C on A4/A5 and SPI on
# D11-D13: Arduino's Uno Rev3 datasheet (source). Signal pins use the silkscreen names D0-D13, A0-A5.
# Size 68.6 x 53.4 mm and the four 3.2 mm holes (550/600/2600/2600 x 100/2000/300/1400 mil from the
#   lower-left corner, USB-B on the left edge): the Uno Rev3 dimensional drawing on the same page.
#   h is an estimate: ~1.5 solder leads + 1.6 PCB + 11 USB-B jack. The USB-B jack position (y 32-44)
#   and its z are estimates too. Measure at H1.
# power_budget_ma: USB gives 500 mA through the polyfuse, minus the board's own ~50 mA; the 3V3 pin
#   alone gives only 50 mA (shortcut: the validator counts every part against one budget).
# Wokwi pin names: https://docs.wokwi.com/parts/wokwi-arduino-uno (Serial needs no wiring there).
